global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'itsm-platform'

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter (system metrics)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # PostgreSQL Exporter
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # Redis Exporter
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  # API Health Check
  - job_name: 'api-health'
    metrics_path: '/health'
    static_configs:
      - targets: ['api:3000']
